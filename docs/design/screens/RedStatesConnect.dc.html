<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>상태 모음 · 요청·연결·애프터</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Asta+Sans:wght@300..800&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#070304}
</style>
</helmet>
<div style="position:relative;width:1600px;height:1280px;box-sizing:border-box;padding:32px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(3,minmax(0,1fr));gap:16px;overflow:hidden;word-break:keep-all;color:#FFF5F6;font-family:'Asta Sans','Noto Sans KR',system-ui,sans-serif;font-variant-numeric:tabular-nums;background:radial-gradient(1100px 620px at 82% 4%,#5A0714 0%,rgba(90,7,20,0) 62%),radial-gradient(900px 620px at 4% 58%,#33050D 0%,rgba(51,5,13,0) 60%),radial-gradient(1000px 480px at 60% 104%,#45060F 0%,rgba(69,6,15,0) 62%),#070304">
  <sc-for list="{{cards}}" as="c" hint-placeholder-count="9">
    <section style="display:flex;flex-direction:column;gap:12px;box-sizing:border-box;padding:26px 28px;min-height:0;border-radius:32px;background:linear-gradient(155deg,rgba(255,255,255,.12) 0%,rgba(150,40,55,.1) 55%,rgba(20,4,8,.4) 100%);border:1.5px solid rgba(255,200,208,.24);box-shadow:0 18px 44px rgba(0,0,0,.6),inset 0 1.5px 0 rgba(255,255,255,.2)">
      <div style="display:flex;align-items:center;gap:14px">
        <span style="display:flex;align-items:center;justify-content:center;width:68px;height:68px;flex:none;border-radius:50%;background:{{c.orb}};box-shadow:{{c.orbSh}}"><svg aria-hidden="true" width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="{{c.ic}}" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="{{c.d}}"></path></svg></span>
        <span style="flex:1;min-width:0;font-size:22px;color:#F3D4D9">{{c.where}}</span>
        <span style="flex:none;padding:6px 16px;border-radius:18px;background:{{c.chip}};font-size:21px;font-weight:700;color:{{c.fg}}">{{c.tag}}</span>
      </div>
      <span style="font-size:33px;line-height:1.24;font-weight:800;letter-spacing:-0.02em;color:#FFFFFF">{{c.title}}</span>
      <span style="font-size:23px;line-height:1.45;color:#F3D4D9">{{c.body}}</span>
      <sc-if value="{{c.action}}" hint-placeholder-val="{{ false }}">
        <button type="button" style="margin-top:auto;height:70px;flex:none;border-radius:32px;background:linear-gradient(155deg,rgba(255,255,255,.18),rgba(120,30,45,.16));border:1.5px solid rgba(255,210,216,.36);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.28),inset 0 -5px 10px rgba(0,0,0,.25);font-family:inherit;font-size:24px;font-weight:700;color:#FFFFFF;cursor:pointer">{{c.action}}</button>
      </sc-if>
    </section>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1600,"height":1280}}'>
class Component extends DCLogic {
  renderVals() {
    const warn = { ic: '#A50A23', fg: '#1A0408', chip: 'linear-gradient(180deg,#FFFFFF,#F0E4E6)', orb: 'radial-gradient(circle at 34% 28%,#FFFFFF,#EADCDF 62%,#C9B5BA)', orbSh: 'inset 0 -4px 8px rgba(120,60,70,.3),0 8px 16px rgba(0,0,0,.45)' };
    const plain = { ic: '#F3D4D9', fg: '#F3D4D9', chip: 'rgba(255,255,255,.12)', orb: 'radial-gradient(circle at 32% 26%,rgba(255,255,255,.28),rgba(90,40,50,.36) 60%,rgba(20,6,10,.7))', orbSh: 'inset 0 1.5px 0 rgba(255,255,255,.35),0 8px 16px rgba(0,0,0,.4)' };
    const icon = {
      close: 'M5 5l14 14M19 5L5 19',
      clock: 'M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18zM12 7v5l3.5 2',
      back: 'M15 5l-7 7 7 7',
      people: 'M9 11a3.4 3.4 0 1 0 0-6.8A3.4 3.4 0 0 0 9 11zM3 20a6 6 0 0 1 12 0M16 11.5a2.5 2.5 0 1 0 0-5M16.5 15.2a4.6 4.6 0 0 1 4.5 4.8',
      chat: 'M4 5h16v11H9l-5 4z',
      warn: 'M12 4l9.5 16.5h-19zM12 10v4.5M12 17.5h.01',
      knot: 'M8 8a4 4 0 1 0 0 8c2.5 0 5.5-8 8-8a4 4 0 1 1 0 8c-2.5 0-5.5-8-8-8z',
      cut: 'M3 12c2-3 4-3 6.5 0M21 12c-2 3-4 3-6.5 0M10 6l1.5 3M14 18l-1.5-3',
    };
    return {
      cards: [
        { ...plain, d: icon.close, where: '보낸 요청', tag: '거절됨', title: '이번에는 연결되지 않았어요', body: '이유는 전달되지 않아요. 같은 사람에게 바로 다시 요청할 수 없어요.', action: '' },
        { ...plain, d: icon.clock, where: '보낸 요청', tag: '만료됨', title: '응답 시간이 지나 요청이 끝났어요', body: '연결은 만들어지지 않았고 기록에도 남지 않아요.', action: '목록으로' },
        { ...plain, d: icon.back, where: '받은 요청', tag: '취소됨', title: '상대가 요청을 취소했어요', body: '수락할 수 없어요. 다른 사람과 자동으로 연결하지 않아요.', action: '' },
        { ...warn, d: icon.people, where: '수락 시점', tag: '연결 불가', title: '지금은 연결할 수 없어요', body: '상대가 멀어졌거나 다른 연결 중이에요. 수락 시점에 다시 확인해요.', action: '목록으로' },
        { ...warn, d: icon.chat, where: '인사', tag: '전송 실패', title: '인사를 보내지 못했어요', body: '연결은 유지 중이에요. 한 번 더 눌러 다시 보낼 수 있어요.', action: '다시 보내기' },
        { ...warn, d: icon.warn, where: '일시 연결', tag: '확인 중', title: '연결 상태를 확인하고 있어요', body: '위치나 통신이 끊겼어요. 멀어졌다고 판단한 것은 아니에요.', action: '' },
        { ...plain, d: icon.knot, where: '애프터', tag: '거절됨', title: '애프터가 이어지지 않았어요', body: '스친 인연 기록은 남아요. 한동안 다시 신청할 수 없어요.', action: '' },
        { ...plain, d: icon.clock, where: '애프터', tag: '만료됨', title: '응답 없이 신청이 끝났어요', body: '새 대화는 열리지 않았어요.', action: '' },
        { ...plain, d: icon.cut, where: '애프터', tag: '철회됨', title: '상대가 신청을 철회했어요', body: '수락할 수 없어요. 기록은 그대로 남아요.', action: '' },
      ],
    };
  }
}
</script>
</body>
</html>
