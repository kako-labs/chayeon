<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1600,"height":1280}}'>
class Component extends DCLogic {
  state = { sent: false };
  renderVals() {
    const sent = this.state.sent;
    return {
      sent,
      compose: !sent,
      send: () => this.setState({ sent: true }),
      withdraw: () => this.setState({ sent: false }),
      tag: sent ? '응답 기다리는 중 · 23시간 남음' : '오늘 18분 함께했어요',
      title: sent ? '느린오후 님의 응답을 기다려요' : '느린오후 님에게 애프터를 신청할까요?',
      body: sent ? '기한 안에 답이 없으면 신청은 만료돼요.' : '상대도 수락하면 거리와 상관없이 이어지는 새 대화가 열려요.',
    };
  }
}
</script>
