<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>이어진 인연</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Asta+Sans:wght@300..800&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#070304}
a{color:inherit;text-decoration:none}
a:focus-visible,button:focus-visible{outline:3px solid #FFFFFF;outline-offset:3px}
</style>
</helmet>
<div style="position:relative;width:1600px;height:1280px;box-sizing:border-box;padding:18px 32px 22px;display:flex;flex-direction:column;gap:14px;overflow:hidden;word-break:keep-all;color:#FFF5F6;font-family:'Asta Sans','Noto Sans KR',system-ui,sans-serif;font-variant-numeric:tabular-nums;background:radial-gradient(1100px 620px at 82% 4%,#5A0714 0%,rgba(90,7,20,0) 62%),radial-gradient(900px 620px at 4% 58%,#33050D 0%,rgba(51,5,13,0) 60%),radial-gradient(1000px 480px at 60% 104%,#45060F 0%,rgba(69,6,15,0) 62%),#070304">

  <div style="display:flex;align-items:center;justify-content:space-between;height:46px;flex:none;font-size:22px;color:#F3D4D9">
    <div style="display:flex;align-items:center;gap:22px"><span style="font-size:26px;font-weight:700;color:#FFFFFF">오후 8:05</span><span style="display:flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:12px;background:rgba(230,30,60,.24);border:1.5px solid rgba(255,120,135,.6);font-weight:800;color:#FFC2CB">P</span><span>주차 중</span></div>
    <span style="font-weight:600">5G</span>
  </div>

  <div style="flex:1;min-height:0;display:grid;grid-template-columns:420px 1fr;gap:14px">
    <section style="display:flex;flex-direction:column;gap:12px;box-sizing:border-box;padding:28px 22px;min-height:0;border-radius:32px;background:linear-gradient(155deg,rgba(255,255,255,.12) 0%,rgba(150,40,55,.1) 55%,rgba(20,4,8,.4) 100%);border:1.5px solid rgba(255,200,208,.24);box-shadow:0 18px 44px rgba(0,0,0,.6),inset 0 1.5px 0 rgba(255,255,255,.2)">
      <h1 style="margin:0;padding:0 6px;font-size:48px;line-height:1.16;font-weight:800;letter-spacing:-0.025em;background:linear-gradient(180deg,#FFFFFF 20%,#FF9AA6 100%);-webkit-background-clip:text;background-clip:text;color:transparent">이어진 인연</h1>
      <p style="margin:0 0 10px;padding:0 6px;font-size:23px;line-height:1.4;color:#F3D4D9">서로 수락해서 이어진 사람들이에요.</p>
      <sc-for list="{{people}}" as="p" hint-placeholder-count="3">
        <button type="button" onClick="{{p.pick}}" aria-pressed="{{p.selected}}" style="display:flex;align-items:center;gap:12px;height:142px;flex:none;box-sizing:border-box;padding:0 16px 0 8px;border-radius:40px;border:2px solid {{p.border}};background:{{p.bg}};box-shadow:{{p.glow}};font-family:inherit;text-align:left;color:#FFFFFF;cursor:pointer">
          <img src="{{p.img}}" alt="" style="width:126px;height:126px;flex:none;filter:drop-shadow(0 10px 12px rgba(0,0,0,.6))">
          <span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px">
            <span style="font-size:31px;font-weight:800;letter-spacing:-0.02em">{{p.nick}}</span>
            <span style="font-size:22px;color:#F3D4D9">{{p.since}}</span>
          </span>
        </button>
      </sc-for>
    </section>

    <div style="display:flex;flex-direction:column;gap:14px;min-height:0">
      <section style="position:relative;overflow:hidden;height:360px;flex:none;display:flex;flex-direction:column;box-sizing:border-box;padding:26px 40px;border-radius:32px;background:radial-gradient(800px 320px at 50% 68%,#7A0E20 0%,rgba(122,14,32,0) 72%),linear-gradient(160deg,#2A050C 0%,#14040A 60%,#0A0304 100%);border:1.5px solid rgba(255,200,208,.3);box-shadow:0 26px 60px rgba(0,0,0,.7),inset 0 1.5px 0 rgba(255,255,255,.2)">
        <h2 style="margin:0;font-size:48px;line-height:1.2;font-weight:800;letter-spacing:-0.025em;background:linear-gradient(180deg,#FFFFFF 30%,#FFC2CB 100%);-webkit-background-clip:text;background-clip:text;color:transparent">{{who.nick}} 님과 이어졌어요</h2>
        <p style="margin:4px 0 0;font-size:25px;line-height:1.4;color:#F7DDE1">거리와 상관없이 이어져요. 둘 중 누구나 끝낼 수 있어요.</p>
        <div style="flex:1;min-height:0;display:flex;align-items:center;justify-content:center">
          <img src="/_blob/0f904edde89f1735c44ed93beec99bb1" alt="" style="width:210px;height:210px;flex:none;filter:drop-shadow(0 16px 20px rgba(0,0,0,.7))">
          <img src="/_blob/152ea35bad46242bcf3889aacbd50f7d" alt="" style="width:590px;height:118px;flex:none;filter:drop-shadow(0 0 18px rgba(240,40,70,.8)) drop-shadow(0 10px 12px rgba(0,0,0,.6))">
          <img src="{{who.img}}" alt="" style="width:210px;height:210px;flex:none;filter:drop-shadow(0 16px 20px rgba(0,0,0,.7))">
        </div>
      </section>

      <div style="flex:1;min-height:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px">
        <section style="display:flex;flex-direction:column;gap:12px;box-sizing:border-box;padding:22px 26px;min-height:0;border-radius:32px;background:linear-gradient(155deg,rgba(255,255,255,.12) 0%,rgba(150,40,55,.1) 55%,rgba(20,4,8,.4) 100%);border:1.5px solid rgba(255,200,208,.24);box-shadow:0 18px 44px rgba(0,0,0,.6),inset 0 1.5px 0 rgba(255,255,255,.2)">
          <h3 style="margin:0;font-size:29px;font-weight:800;color:#FFFFFF">이어진 대화</h3>
          <div style="flex:1;min-height:0;display:flex;flex-direction:column;justify-content:flex-end;gap:12px;overflow:hidden">
            <sc-for list="{{msgs}}" as="m" hint-placeholder-count="3">
              <div style="display:flex;justify-content:{{m.align}};flex:none">
                <span style="display:block;max-width:84%;box-sizing:border-box;padding:14px 24px;border-radius:30px;background:{{m.bg}};border:{{m.bd}};box-shadow:{{m.sh}};font-size:27px;line-height:1.3;font-weight:600;color:#FFFFFF">{{m.text}}</span>
              </div>
            </sc-for>
          </div>
        </section>
        <section style="display:flex;flex-direction:column;gap:12px;box-sizing:border-box;padding:22px 26px;min-height:0;border-radius:32px;background:linear-gradient(155deg,rgba(255,255,255,.12) 0%,rgba(150,40,55,.1) 55%,rgba(20,4,8,.4) 100%);border:1.5px solid rgba(255,200,208,.24);box-shadow:0 18px 44px rgba(0,0,0,.6),inset 0 1.5px 0 rgba(255,255,255,.2)">
          <h3 style="margin:0;font-size:29px;font-weight:800;color:#FFFFFF">인사 보내기</h3>
          <div style="flex:1;min-height:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(3,minmax(0,1fr));gap:10px">
            <sc-for list="{{presets}}" as="p" hint-placeholder-count="6">
              <button type="button" onClick="{{p.send}}" style="box-sizing:border-box;padding:0 12px;border-radius:30px;background:linear-gradient(155deg,rgba(255,255,255,.18),rgba(120,30,45,.16));border:1.5px solid rgba(255,210,216,.36);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.28),inset 0 -5px 10px rgba(0,0,0,.25),0 6px 16px rgba(0,0,0,.35);font-family:inherit;font-size:25px;line-height:1.25;font-weight:700;color:#FFFFFF;cursor:pointer">{{p.text}}</button>
            </sc-for>
          </div>
        </section>
      </div>

      <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;flex:none">
        <a href="RedCleanup.dc.html" style="display:flex;align-items:center;justify-content:center;height:84px;box-sizing:border-box;border-radius:34px;background:linear-gradient(155deg,rgba(255,255,255,.18),rgba(120,30,45,.16));border:1.5px solid rgba(255,210,216,.36);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.28),inset 0 -5px 10px rgba(0,0,0,.25),0 8px 20px rgba(0,0,0,.35);font-size:27px;font-weight:700;color:#FFFFFF">관계 끝내기</a>
        <a href="RedBlockReport.dc.html" style="display:flex;align-items:center;justify-content:center;height:84px;box-sizing:border-box;border-radius:34px;background:rgba(0,0,0,.35);border:1.5px solid rgba(255,107,125,.7);font-size:27px;font-weight:700;color:#FF9AA6">차단·신고</a>
      </div>
    </div>
  </div>

  <nav aria-label="주요 메뉴" style="position:relative;display:grid;grid-template-columns:1fr 1fr 220px 1fr 1fr;align-items:center;height:100px;flex:none;border-radius:40px;background:linear-gradient(180deg,rgba(255,255,255,.12),rgba(60,10,20,.45));border:1.5px solid rgba(255,200,208,.24);box-shadow:0 18px 44px rgba(0,0,0,.6),inset 0 1.5px 0 rgba(255,255,255,.2)">
    <a href="RedHome.dc.html" style="display:flex;flex-direction:column;align-items:center;gap:4px;font-size:21px;color:#F3D4D9"><svg aria-hidden="true" width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#F3D4D9" stroke-width="2" stroke-linecap="round"><path d="M6.5 17C6.5 9 17.5 15 17.5 7M6.5 19.4a2.4 2.4 0 1 0 0-4.8 2.4 2.4 0 0 0 0 4.8zM17.5 9.4a2.4 2.4 0 1 0 0-4.8 2.4 2.4 0 0 0 0 4.8z"></path></svg>오늘의 인연</a>
    <a href="RedEncounters.dc.html" style="display:flex;flex-direction:column;align-items:center;gap:4px;font-size:21px;color:#F3D4D9"><svg aria-hidden="true" width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#F3D4D9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21a9 9 0 1 0-8.2-5.3M3 21v-5h5M12 7v5l3.5 2"></path></svg>스친 인연</a>
    <a href="RedHome.dc.html" style="position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;justify-self:center;width:122px;height:122px;margin-top:-16px;box-sizing:border-box;border-radius:50%;background:radial-gradient(circle at 34% 24%,#FF8A96 0%,#E3173A 48%,#8E0A20 100%);border:2px solid rgba(255,220,225,.8);box-shadow:0 0 0 8px rgba(230,30,60,.16),0 0 56px rgba(230,30,60,.75),inset 0 2px 0 rgba(255,255,255,.55),inset 0 -8px 14px rgba(70,0,12,.5);font-weight:800;color:#FFFFFF"><svg aria-hidden="true" width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"><path d="M6.5 17C6.5 9 17.5 15 17.5 7M6.5 19.4a2.4 2.4 0 1 0 0-4.8 2.4 2.4 0 0 0 0 4.8zM17.5 9.4a2.4 2.4 0 1 0 0-4.8 2.4 2.4 0 0 0 0 4.8z"></path></svg><span style="font-size:21px">발견 중</span></a>
    <a href="RedAfterConnected.dc.html" aria-current="page" style="display:flex;flex-direction:column;align-items:center;gap:4px;font-size:21px;font-weight:700;color:#FF9AA6"><svg aria-hidden="true" width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#FF9AA6" stroke-width="2.4" stroke-linecap="round"><path d="M8 8a4 4 0 1 0 0 8c2.5 0 5.5-8 8-8a4 4 0 1 1 0 8c-2.5 0-5.5-8-8-8z"></path></svg>이어진 인연</a>
    <a href="RedSettings.dc.html" style="display:flex;flex-direction:column;align-items:center;gap:4px;font-size:21px;color:#F3D4D9"><svg aria-hidden="true" width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#F3D4D9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 12a4.5 4.5 0 1 0 0-9 4.5 4.5 0 0 0 0 9zM3.5 21a8.5 8.5 0 0 1 17 0"></path></svg>내 정보</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1600,"height":1280}}'>
class Component extends DCLogic {
  state = {
    who: 'slow',
    threads: {
      slow: [{ mine: true, text: '다시 만나서 반가워요' }, { mine: false, text: '좋은 저녁이에요' }],
      star: [{ mine: false, text: '안녕하세요' }, { mine: true, text: '반가워요' }, { mine: false, text: '관심사가 비슷하네요' }],
      jazz: [{ mine: true, text: '안녕하세요' }, { mine: false, text: '잠시 후 다시 이야기해요' }],
    },
  };
  renderVals() {
    const list = [
      { id: 'slow', nick: '느린오후', since: '오늘 이어짐', img: '/_blob/c6f3bc14f5339443dc40ef660adcf415' },
      { id: 'star', nick: '별보는밤', since: '어제 이어짐', img: '/_blob/e656d9d0d2a0c82029ccd6b9fa1a0b34' },
      { id: 'jazz', nick: '재즈한잔', since: '10월 31일 이어짐', img: '/_blob/4016572205c37833d7bdd88c57a3d6e4' },
    ];
    const whoId = this.state.who;
    const texts = ['안녕하세요', '좋은 저녁이에요', '다시 만나서 반가워요', '관심사가 비슷하네요', '잠시 후 다시 이야기해요', '조심히 가세요'];
    return {
      people: list.map((p) => {
        const selected = p.id === whoId;
        return {
          ...p,
          selected,
          border: selected ? 'rgba(255,225,230,.9)' : 'rgba(255,200,208,.2)',
          bg: selected ? 'linear-gradient(180deg,rgba(230,30,60,.42),rgba(120,10,30,.42))' : 'rgba(0,0,0,.35)',
          glow: selected ? '0 0 26px rgba(230,30,60,.45),inset 0 1.5px 0 rgba(255,255,255,.28)' : 'none',
          pick: () => this.setState({ who: p.id }),
        };
      }),
      who: list.find((p) => p.id === whoId),
      msgs: this.state.threads[whoId].slice(-4).map((m) => ({
        ...m,
        align: m.mine ? 'flex-end' : 'flex-start',
        bg: m.mine ? 'linear-gradient(180deg,#FF4A5E 0%,#D5102F 55%,#A50A23 100%)' : 'rgba(255,255,255,.14)',
        bd: m.mine ? '1.5px solid rgba(255,190,198,.6)' : '1.5px solid rgba(255,200,208,.24)',
        sh: m.mine ? 'inset 0 2px 0 rgba(255,255,255,.4),inset 0 -4px 8px rgba(90,0,15,.45),0 8px 18px rgba(0,0,0,.4)' : 'inset 0 1.5px 0 rgba(255,255,255,.2),0 8px 18px rgba(0,0,0,.3)',
      })),
      presets: texts.map((text) => ({
        text,
        send: () => this.setState({ threads: { ...this.state.threads, [whoId]: this.state.threads[whoId].concat({ mine: true, text }) } }),
      })),
    };
  }
}
</script>
</body>
</html>
