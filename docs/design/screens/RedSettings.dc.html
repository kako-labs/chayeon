<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>내 정보</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Asta+Sans:wght@300..800&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#070304}
a{color:inherit;text-decoration:none}
a:focus-visible,button:focus-visible{outline:3px solid #FFFFFF;outline-offset:3px}
</style>
</helmet>
<div style="position:relative;width:1600px;height:1280px;box-sizing:border-box;padding:18px 32px 22px;display:flex;flex-direction:column;gap:14px;overflow:hidden;word-break:keep-all;color:#FFF5F6;font-family:'Asta Sans','Noto Sans KR',system-ui,sans-serif;font-variant-numeric:tabular-nums;background:radial-gradient(1100px 620px at 82% 4%,#5A0714 0%,rgba(90,7,20,0) 62%),radial-gradient(900px 620px at 4% 58%,#33050D 0%,rgba(51,5,13,0) 60%),radial-gradient(1000px 480px at 60% 104%,#45060F 0%,rgba(69,6,15,0) 62%),#070304">

  <div style="display:flex;align-items:center;justify-content:space-between;height:46px;flex:none;font-size:22px;color:#F3D4D9">
    <div style="display:flex;align-items:center;gap:22px"><span style="font-size:26px;font-weight:700;color:#FFFFFF">오후 8:10</span><span style="display:flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:12px;background:rgba(230,30,60,.24);border:1.5px solid rgba(255,120,135,.6);font-weight:800;color:#FFC2CB">P</span><span>주차 중</span></div>
    <div style="display:flex;align-items:center;gap:20px"><span style="display:flex;align-items:center;height:40px;box-sizing:border-box;padding:0 16px;border-radius:20px;background:rgba(255,255,255,.08);border:1.5px solid rgba(255,255,255,.4);font-size:21px;font-weight:700;color:#FFF5F6">합성 위치</span><span style="font-weight:600">5G</span></div>
  </div>

  <div style="flex:1;min-height:0;display:grid;grid-template-columns:520px 1fr;gap:14px">
    <section style="position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;box-sizing:border-box;padding:34px 36px;border-radius:32px;background:radial-gradient(560px 460px at 50% 40%,#6A0C1C 0%,rgba(106,12,28,0) 74%),linear-gradient(160deg,#2A050C 0%,#14040A 60%,#0A0304 100%);border:1.5px solid rgba(255,200,208,.3);box-shadow:0 26px 60px rgba(0,0,0,.7),inset 0 1.5px 0 rgba(255,255,255,.2);text-align:center">
      <h1 style="margin:0;align-self:flex-start;font-size:44px;line-height:1.14;font-weight:800;letter-spacing:-0.025em;background:linear-gradient(180deg,#FFFFFF 20%,#FF9AA6 100%);-webkit-background-clip:text;background-clip:text;color:transparent">내 정보</h1>
      <div style="display:flex;flex-direction:column;align-items:center;gap:14px;margin:auto 0">
        <img src="/_blob/0f904edde89f1735c44ed93beec99bb1" alt="새벽드라이브의 가상 아바타" style="width:380px;height:380px;filter:drop-shadow(0 26px 30px rgba(0,0,0,.7)) drop-shadow(0 0 40px rgba(230,30,60,.35))">
        <span style="font-size:54px;line-height:1.2;font-weight:800;letter-spacing:-0.025em;color:#FFFFFF">새벽드라이브</span>
        <span style="display:flex;align-items:center;height:44px;box-sizing:border-box;padding:0 18px;border-radius:22px;background:rgba(230,30,60,.24);border:1.5px solid rgba(255,120,135,.6);font-size:22px;font-weight:700;color:#FFC2CB">테스트 계정 A</span>
        <div style="display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:6px">
          <span style="display:flex;align-items:center;height:48px;box-sizing:border-box;padding:0 20px;border-radius:24px;background:linear-gradient(180deg,#FFFFFF,#F0E4E6);box-shadow:inset 0 -3px 6px rgba(120,60,70,.2),0 6px 14px rgba(0,0,0,.35);font-size:23px;font-weight:800;color:#A50A23">야경</span>
          <span style="display:flex;align-items:center;height:48px;box-sizing:border-box;padding:0 20px;border-radius:24px;background:linear-gradient(180deg,#FFFFFF,#F0E4E6);box-shadow:inset 0 -3px 6px rgba(120,60,70,.2),0 6px 14px rgba(0,0,0,.35);font-size:23px;font-weight:800;color:#A50A23">재즈</span>
          <span style="display:flex;align-items:center;height:48px;box-sizing:border-box;padding:0 20px;border-radius:24px;background:linear-gradient(180deg,#FFFFFF,#F0E4E6);box-shadow:inset 0 -3px 6px rgba(120,60,70,.2),0 6px 14px rgba(0,0,0,.35);font-size:23px;font-weight:800;color:#A50A23">드라이브 음악</span>
          <span style="display:flex;align-items:center;height:48px;box-sizing:border-box;padding:0 20px;border-radius:24px;background:linear-gradient(180deg,#FFFFFF,#F0E4E6);box-shadow:inset 0 -3px 6px rgba(120,60,70,.2),0 6px 14px rgba(0,0,0,.35);font-size:23px;font-weight:800;color:#A50A23">커피</span>
        </div>
      </div>
      <a href="RedProfileSetup.dc.html" style="display:flex;align-items:center;justify-content:center;width:100%;height:100px;flex:none;box-sizing:border-box;border-radius:40px;background:linear-gradient(180deg,#FF4A5E 0%,#D5102F 52%,#A50A23 100%);border:1.5px solid rgba(255,190,198,.7);box-shadow:0 0 36px rgba(230,30,60,.55),inset 0 2.5px 0 rgba(255,255,255,.45),inset 0 -7px 14px rgba(90,0,15,.55);font-size:32px;font-weight:800;color:#FFFFFF">프로필 편집</a>
    </section>

    <div style="display:flex;flex-direction:column;gap:12px;min-height:0">
      <div style="flex:1;min-height:0;display:flex;align-items:center;gap:22px;box-sizing:border-box;padding:0 30px;border-radius:36px;background:linear-gradient(155deg,rgba(255,255,255,.12) 0%,rgba(150,40,55,.1) 55%,rgba(20,4,8,.4) 100%);border:1.5px solid rgba(255,200,208,.24);box-shadow:0 12px 28px rgba(0,0,0,.45),inset 0 1.5px 0 rgba(255,255,255,.2)">
        <span style="display:flex;align-items:center;justify-content:center;width:88px;height:88px;flex:none;border-radius:50%;background:radial-gradient(circle at 32% 26%,rgba(255,170,180,.6),rgba(150,20,40,.45) 60%,rgba(30,4,8,.7));border:1.5px solid rgba(255,190,198,.45);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.45),inset 0 -5px 10px rgba(40,0,8,.5),0 10px 20px rgba(0,0,0,.45)"><svg aria-hidden="true" width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="#FFE3E7" stroke-width="2" stroke-linecap="round"><path d="M6.5 17C6.5 9 17.5 15 17.5 7M6.5 19.4a2.4 2.4 0 1 0 0-4.8 2.4 2.4 0 0 0 0 4.8zM17.5 9.4a2.4 2.4 0 1 0 0-4.8 2.4 2.4 0 0 0 0 4.8z"></path></svg></span>
        <span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:4px"><span style="font-size:32px;font-weight:800;color:#FFFFFF">발견 참여</span><span style="font-size:24px;line-height:1.35;color:#F3D4D9">{{discoverSub}}</span></span>
        <button type="button" onClick="{{toggle}}" aria-pressed="{{on}}" aria-label="발견 참여" style="display:flex;align-items:center;justify-content:{{align}};width:124px;height:66px;flex:none;box-sizing:border-box;padding:6px;border:none;border-radius:33px;background:{{track}};box-shadow:{{trackSh}};cursor:pointer"><span style="display:block;width:54px;height:54px;border-radius:50%;background:{{knob}};box-shadow:0 3px 8px rgba(0,0,0,.5),inset 0 -3px 5px rgba(120,60,70,.25)"></span></button>
      </div>
      <sc-for list="{{rows}}" as="r" hint-placeholder-count="4">
        <a href="{{r.href}}" style="flex:1;min-height:0;display:flex;align-items:center;gap:22px;box-sizing:border-box;padding:0 30px;border-radius:36px;background:linear-gradient(155deg,rgba(255,255,255,.12) 0%,rgba(150,40,55,.1) 55%,rgba(20,4,8,.4) 100%);border:1.5px solid rgba(255,200,208,.24);box-shadow:0 12px 28px rgba(0,0,0,.45),inset 0 1.5px 0 rgba(255,255,255,.2)">
          <span style="display:flex;align-items:center;justify-content:center;width:88px;height:88px;flex:none;border-radius:50%;background:radial-gradient(circle at 32% 26%,rgba(255,170,180,.6),rgba(150,20,40,.45) 60%,rgba(30,4,8,.7));border:1.5px solid rgba(255,190,198,.45);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.45),inset 0 -5px 10px rgba(40,0,8,.5),0 10px 20px rgba(0,0,0,.45)"><svg aria-hidden="true" width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="#FFE3E7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="{{r.d}}"></path></svg></span>
          <span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:4px"><span style="font-size:32px;font-weight:800;color:#FFFFFF">{{r.title}}</span><span style="font-size:24px;line-height:1.35;color:#F3D4D9">{{r.sub}}</span></span>
          <svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#F3D4D9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="flex:none"><path d="M9 5l7 7-7 7"></path></svg>
        </a>
      </sc-for>
      <div style="flex:none;display:flex;align-items:flex-start;gap:14px;box-sizing:border-box;padding:18px 24px;border-radius:28px;background:rgba(0,0,0,.42);border:1.5px solid rgba(255,200,208,.2)">
        <svg aria-hidden="true" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#FF9AA6" stroke-width="2" stroke-linecap="round" style="flex:none;margin-top:2px"><path d="M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18zM12 11v5M12 8h.01"></path></svg>
        <span style="font-size:23px;line-height:1.45;color:#F7DDE1">테스트 로그인, 연령 확인, 신고 저장은 시연용이에요. 실제 인증과 신고 운영은 아직 제공하지 않아요.</span>
      </div>
    </div>
  </div>

  <nav aria-label="주요 메뉴" style="position:relative;display:grid;grid-template-columns:1fr 1fr 220px 1fr 1fr;align-items:center;height:100px;flex:none;border-radius:40px;background:linear-gradient(180deg,rgba(255,255,255,.12),rgba(60,10,20,.45));border:1.5px solid rgba(255,200,208,.24);box-shadow:0 18px 44px rgba(0,0,0,.6),inset 0 1.5px 0 rgba(255,255,255,.2)">
    <a href="RedHome.dc.html" style="display:flex;flex-direction:column;align-items:center;gap:4px;font-size:21px;color:#F3D4D9"><svg aria-hidden="true" width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#F3D4D9" stroke-width="2" stroke-linecap="round"><path d="M6.5 17C6.5 9 17.5 15 17.5 7M6.5 19.4a2.4 2.4 0 1 0 0-4.8 2.4 2.4 0 0 0 0 4.8zM17.5 9.4a2.4 2.4 0 1 0 0-4.8 2.4 2.4 0 0 0 0 4.8z"></path></svg>오늘의 인연</a>
    <a href="RedEncounters.dc.html" style="display:flex;flex-direction:column;align-items:center;gap:4px;font-size:21px;color:#F3D4D9"><svg aria-hidden="true" width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#F3D4D9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21a9 9 0 1 0-8.2-5.3M3 21v-5h5M12 7v5l3.5 2"></path></svg>스친 인연</a>
    <a href="RedHome.dc.html" style="position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;justify-self:center;width:122px;height:122px;margin-top:-16px;box-sizing:border-box;border-radius:50%;background:radial-gradient(circle at 34% 24%,#FF8A96 0%,#E3173A 48%,#8E0A20 100%);border:2px solid rgba(255,220,225,.8);box-shadow:0 0 0 8px rgba(230,30,60,.16),0 0 56px rgba(230,30,60,.75),inset 0 2px 0 rgba(255,255,255,.55),inset 0 -8px 14px rgba(70,0,12,.5);font-weight:800;color:#FFFFFF"><svg aria-hidden="true" width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"><path d="M6.5 17C6.5 9 17.5 15 17.5 7M6.5 19.4a2.4 2.4 0 1 0 0-4.8 2.4 2.4 0 0 0 0 4.8zM17.5 9.4a2.4 2.4 0 1 0 0-4.8 2.4 2.4 0 0 0 0 4.8z"></path></svg><span style="font-size:21px">{{navLabel}}</span></a>
    <a href="RedAfterConnected.dc.html" style="display:flex;flex-direction:column;align-items:center;gap:4px;font-size:21px;color:#F3D4D9"><svg aria-hidden="true" width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#F3D4D9" stroke-width="2" stroke-linecap="round"><path d="M8 8a4 4 0 1 0 0 8c2.5 0 5.5-8 8-8a4 4 0 1 1 0 8c-2.5 0-5.5-8-8-8z"></path></svg>이어진 인연</a>
    <a href="RedSettings.dc.html" aria-current="page" style="display:flex;flex-direction:column;align-items:center;gap:4px;font-size:21px;font-weight:700;color:#FF9AA6"><svg aria-hidden="true" width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#FF9AA6" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 12a4.5 4.5 0 1 0 0-9 4.5 4.5 0 0 0 0 9zM3.5 21a8.5 8.5 0 0 1 17 0"></path></svg>내 정보</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1600,"height":1280}}'>
class Component extends DCLogic {
  state = { on: true };
  renderVals() {
    const on = this.state.on;
    return {
      on,
      toggle: () => this.setState({ on: !this.state.on }),
      discoverSub: on ? '근처 참여자에게 내 카드가 보이고 있어요.' : '내 카드가 보이지 않고, 새 요청도 받지 않아요.',
      navLabel: on ? '발견 중' : '꺼짐',
      track: on ? 'linear-gradient(180deg,#FF4A5E,#C20D29)' : 'rgba(0,0,0,.5)',
      trackSh: on ? 'inset 0 2px 0 rgba(255,255,255,.4),0 0 22px rgba(230,30,60,.6)' : 'inset 0 2px 6px rgba(0,0,0,.6)',
      knob: on ? 'radial-gradient(circle at 35% 30%,#FFFFFF,#EADCDF)' : '#9A8A8E',
      align: on ? 'flex-end' : 'flex-start',
      rows: [
        { href: 'RedConsent.dc.html', d: 'M2 12s4-7 10-7 10 7 10 7-4 7-10 7-10-7-10-7zM12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z', title: '위치와 공개 범위', sub: '상대에게 보이는 항목과 위치 사용을 확인해요.' },
        { href: 'RedBlockReport.dc.html', d: 'M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18zM5.6 5.6l12.8 12.8', title: '차단과 신고', sub: '차단한 사람 2명' },
        { href: 'RedCleanup.dc.html', d: 'M4 7h16M9 7V4h6v3M6 7l1 14h10l1-14', title: '기록과 계정 정리', sub: '무엇이 지워지고 무엇이 남는지 비교해요.' },
        { href: 'RedFirstRun.dc.html', d: 'M9 4H4v16h5M15 8l4 4-4 4M19 12H9', title: '로그아웃', sub: '이 차량에 남은 프로필과 대화를 지워요. 함께 쓰는 차량이라면 꼭 눌러주세요.' },
      ],
    };
  }
}
</script>
</body>
</html>
