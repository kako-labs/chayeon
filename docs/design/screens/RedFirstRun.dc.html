<body>

</helmet>
<div style="position:relative;width:1600px;height:1280px;box-sizing:border-box;padding:18px 32px 22px;display:flex;flex-direction:column;gap:14px;overflow:hidden;word-break:keep-all;color:#FFF5F6;font-family:'Asta Sans','Noto Sans KR',system-ui,sans-serif;font-variant-numeric:tabular-nums;background:radial-gradient(1100px 620px at 82% 4%,#5A0714 0%,rgba(90,7,20,0) 62%),radial-gradient(900px 620px at 4% 58%,#33050D 0%,rgba(51,5,13,0) 60%),radial-gradient(1000px 480px at 60% 104%,#45060F 0%,rgba(69,6,15,0) 62%),#070304">

  <div style="display:flex;align-items:center;justify-content:space-between;height:46px;flex:none;font-size:22px;color:#F3D4D9">
    <div style="display:flex;align-items:center;gap:22px"><span style="font-size:26px;font-weight:700;color:#FFFFFF">오후 7:12</span><span style="display:flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:12px;background:rgba(230,30,60,.24);border:1.5px solid rgba(255,120,135,.6);font-weight:800;color:#FFC2CB">P</span><span>주차 중</span></div>
    <div style="display:flex;align-items:center;gap:20px"><span style="display:flex;align-items:center;height:40px;box-sizing:border-box;padding:0 16px;border-radius:20px;background:rgba(255,255,255,.08);border:1.5px solid rgba(255,255,255,.4);font-size:21px;font-weight:700;color:#FFF5F6">합성 위치</span><span style="font-weight:600">5G</span></div>
  </div>

  <header style="display:flex;align-items:center;justify-content:space-between;gap:24px;height:92px;flex:none">
    <div style="display:flex;align-items:center;gap:20px">
      <img src="/_blob/e8be9c615cadd646113cdbd6506c915b" alt="" style="width:88px;height:88px;border-radius:50%;object-fit:cover;box-shadow:0 0 34px rgba(230,30,60,.6),0 0 0 1.5px rgba(255,200,208,.5)">
      <div style="display:flex;flex-direction:column;gap:2px">
        <span style="font-size:50px;line-height:1.1;font-weight:800;letter-spacing:-0.02em;background:linear-gradient(180deg,#FFFFFF 20%,#FF9AA6 100%);-webkit-background-clip:text;background-clip:text;color:transparent">차연</span>
        <span style="font-size:23px;color:#F3D4D9">길 위에서 시작되는 인연</span>
      </div>
    </div>
    <ol aria-label="참여 준비 단계" style="display:flex;align-items:center;gap:12px;margin:0;padding:0;list-style:none">
      <li style="display:flex;align-items:center;gap:10px;height:56px;box-sizing:border-box;padding:0 22px 0 8px;border-radius:28px;background:linear-gradient(180deg,#FFFFFF,#F0E4E6);box-shadow:inset 0 -3px 6px rgba(120,60,70,.2),0 8px 18px rgba(0,0,0,.4);font-size:23px;font-weight:800;color:#A50A23"><span style="display:flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:50%;background:radial-gradient(circle at 34% 24%,#FF8A96,#D5102F 60%,#8E0A20);font-size:21px;color:#FFFFFF">1</span>계정</li>
      <li style="display:flex;align-items:center;gap:10px;height:56px;box-sizing:border-box;padding:0 22px 0 8px;border-radius:28px;background:rgba(0,0,0,.3);border:1.5px solid rgba(255,200,208,.3);font-size:23px;color:#F3D4D9"><span style="display:flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.12);font-size:21px">2</span>프로필</li>
      <li style="display:flex;align-items:center;gap:10px;height:56px;box-sizing:border-box;padding:0 22px 0 8px;border-radius:28px;background:rgba(0,0,0,.3);border:1.5px solid rgba(255,200,208,.3);font-size:23px;color:#F3D4D9"><span style="display:flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.12);font-size:21px">3</span>위치·공개 범위</li>
    </ol>
  </header>

  <div style="flex:1;min-height:0;display:grid;grid-template-columns:860px 1fr;gap:14px">
    <section style="position:relative;overflow:hidden;display:flex;flex-direction:column;box-sizing:border-box;padding:44px;border-radius:32px;background:linear-gradient(160deg,#3A0710 0%,#1A0408 58%,#0C0305 100%);border:1.5px solid rgba(255,200,208,.3);box-shadow:0 26px 60px rgba(0,0,0,.7),inset 0 1.5px 0 rgba(255,255,255,.2)">
      <img src="/_blob/fd558eefa8337e514bbb8c30c397f764" alt="" style="position:absolute;left:0;top:176px;width:860px;height:860px;-webkit-mask-image:linear-gradient(180deg,#000 62%,rgba(0,0,0,0) 80%);mask-image:linear-gradient(180deg,#000 62%,rgba(0,0,0,0) 80%)">
      <h1 style="position:relative;margin:0;font-size:84px;line-height:1.18;font-weight:800;letter-spacing:-0.03em;background:linear-gradient(180deg,#FFFFFF 40%,#FFC2CB 100%);-webkit-background-clip:text;background-clip:text;color:transparent">서로 원할 때만<br>이어져요</h1>
      <ul style="position:relative;margin:auto 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:12px;font-size:28px;font-weight:600">
        <li style="display:flex;align-items:center;gap:16px"><span style="display:flex;align-items:center;justify-content:center;width:44px;height:44px;flex:none;border-radius:50%;background:radial-gradient(circle at 34% 24%,#FF8A96,#D5102F 60%,#8E0A20);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.5),0 6px 14px rgba(0,0,0,.5)"><svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l6 6L20 6"></path></svg></span>발견을 켠 사람끼리만 보여요</li>
        <li style="display:flex;align-items:center;gap:16px"><span style="display:flex;align-items:center;justify-content:center;width:44px;height:44px;flex:none;border-radius:50%;background:radial-gradient(circle at 34% 24%,#FF8A96,#D5102F 60%,#8E0A20);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.5),0 6px 14px rgba(0,0,0,.5)"><svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l6 6L20 6"></path></svg></span>양쪽이 수락해야 대화가 열려요</li>
        <li style="display:flex;align-items:center;gap:16px"><span style="display:flex;align-items:center;justify-content:center;width:44px;height:44px;flex:none;border-radius:50%;background:radial-gradient(circle at 34% 24%,#FF8A96,#D5102F 60%,#8E0A20);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.5),0 6px 14px rgba(0,0,0,.5)"><svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l6 6L20 6"></path></svg></span>멀어지면 끝나고, 다시 원할 때만 이어져요</li>
      </ul>
    </section>

    <div style="display:flex;flex-direction:column;gap:14px;min-height:0">
      <fieldset style="flex:1;min-height:0;display:flex;flex-direction:column;gap:14px;margin:0;box-sizing:border-box;padding:30px 32px;border-radius:32px;background:linear-gradient(155deg,rgba(255,255,255,.12) 0%,rgba(150,40,55,.1) 55%,rgba(20,4,8,.4) 100%);border:1.5px solid rgba(255,200,208,.24);box-shadow:0 18px 44px rgba(0,0,0,.6),inset 0 1.5px 0 rgba(255,255,255,.2)">
        <legend style="float:left;width:100%;padding:0;margin-bottom:6px;font-size:40px;line-height:1.2;font-weight:800;letter-spacing:-0.02em;color:#FFFFFF">시연 계정을 고르세요</legend>
        <sc-for list="{{accounts}}" as="a" hint-placeholder-count="3">
          <label style="position:relative;flex:1;min-height:0;display:flex;align-items:center;gap:22px;box-sizing:border-box;padding:0 28px 0 22px;border-radius:30px;border:2px solid {{a.border}};background:{{a.bg}};box-shadow:{{a.glow}};cursor:pointer">
            <span style="display:flex;width:128px;height:128px;flex:none;overflow:hidden;border-radius:50%;background:radial-gradient(circle at 50% 38%,#7A1424 0%,#3A0A14 58%,#150408 100%);box-shadow:0 0 0 2px rgba(255,190,198,.55),0 10px 22px rgba(0,0,0,.55)"><img src="{{a.img}}" alt="" style="width:128px;height:128px"></span>
            <span style="flex:1;display:flex;flex-direction:column;gap:2px">
              <span style="font-size:36px;font-weight:800;letter-spacing:-0.02em;color:#FFFFFF">{{a.nick}}</span>
              <span style="font-size:23px;color:#F3D4D9">{{a.tag}}</span>
            </span>
            <input type="radio" name="account" checked="{{a.selected}}" onChange="{{a.pick}}" aria-label="{{a.nick}}" style="position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer">
            <span aria-hidden="true" style="display:flex;align-items:center;justify-content:center;width:50px;height:50px;flex:none;box-sizing:border-box;border-radius:50%;border:2px solid {{a.mark}};background:{{a.markBg}};box-shadow:inset 0 1.5px 0 rgba(255,255,255,.4)"><sc-if value="{{a.selected}}" hint-placeholder-val="{{ false }}"><span style="display:block;width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFFFFF,#EADCDF)"></span></sc-if></span>
          </label>
        </sc-for>
      </fieldset>
      <div style="flex:none;display:flex;align-items:flex-start;gap:14px;box-sizing:border-box;padding:18px 22px;border-radius:24px;background:rgba(0,0,0,.4);border:1.5px solid rgba(255,200,208,.2)">
        <svg aria-hidden="true" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#FF9AA6" stroke-width="2" stroke-linecap="round" style="flex:none;margin-top:2px"><path d="M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18zM12 11v5M12 8h.01"></path></svg>
        <span style="font-size:23px;line-height:1.45;color:#F7DDE1">가상 프로필만 사용해요. 실제 가입과 연령 확인은 아직 제공하지 않아요.</span>
      </div>
      <a href="RedProfileSetup.dc.html" style="display:flex;align-items:center;justify-content:center;height:112px;flex:none;box-sizing:border-box;border-radius:40px;background:linear-gradient(180deg,#FF4A5E 0%,#D5102F 52%,#A50A23 100%);border:1.5px solid rgba(255,190,198,.7);box-shadow:0 0 36px rgba(230,30,60,.55),inset 0 2.5px 0 rgba(255,255,255,.45),inset 0 -7px 14px rgba(90,0,15,.55);font-size:36px;font-weight:800;color:#FFFFFF">이 계정으로 시작</a>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1600,"height":1280}}'>
class Component extends DCLogic {
  state = { pick: 'a' };
  renderVals() {
    const list = [
      { id: 'a', nick: '새벽드라이브', tag: '테스트 계정 A', img: '/_blob/0f904edde89f1735c44ed93beec99bb1' },
      { id: 'b', nick: '느린오후', tag: '테스트 계정 B', img: '/_blob/c6f3bc14f5339443dc40ef660adcf415' },
      { id: 'c', nick: '재즈한잔', tag: '테스트 계정 C', img: '/_blob/4016572205c37833d7bdd88c57a3d6e4' },
    ];
    return {
      accounts: list.map((a) => {
        const selected = this.state.pick === a.id;
        return {
          ...a,
          selected,
          border: selected ? 'rgba(255,225,230,.9)' : 'rgba(255,200,208,.2)',
          bg: selected ? 'linear-gradient(180deg,rgba(230,30,60,.42),rgba(120,10,30,.42))' : 'rgba(0,0,0,.35)',
          glow: selected ? '0 0 30px rgba(230,30,60,.45),inset 0 1.5px 0 rgba(255,255,255,.28)' : 'none',
          mark: selected ? 'rgba(255,225,230,.95)' : 'rgba(255,200,208,.5)',
          markBg: selected ? 'linear-gradient(180deg,#FF4A5E,#C20D29)' : 'rgba(0,0,0,.5)',
          pick: () => this.setState({ pick: a.id }),
        };
      }),
    };
  }
}
</script>
</body>
</html>
