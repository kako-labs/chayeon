<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>위치·공개 범위</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Asta+Sans:wght@300..800&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#070304}
a{color:inherit;text-decoration:none}
a:focus-visible,button:focus-visible{outline:3px solid #FFFFFF;outline-offset:3px}
</style>
</helmet>
<div style="position:relative;width:1600px;height:1280px;box-sizing:border-box;padding:18px 32px 22px;display:flex;flex-direction:column;gap:14px;overflow:hidden;word-break:keep-all;color:#FFF5F6;font-family:'Asta Sans','Noto Sans KR',system-ui,sans-serif;font-variant-numeric:tabular-nums;background:radial-gradient(1100px 620px at 82% 4%,#5A0714 0%,rgba(90,7,20,0) 62%),radial-gradient(900px 620px at 4% 58%,#33050D 0%,rgba(51,5,13,0) 60%),radial-gradient(1000px 480px at 60% 104%,#45060F 0%,rgba(69,6,15,0) 62%),#070304">

  <div style="display:flex;align-items:center;justify-content:space-between;height:46px;flex:none;font-size:22px;color:#F3D4D9">
    <div style="display:flex;align-items:center;gap:22px"><span style="font-size:26px;font-weight:700;color:#FFFFFF">오후 7:14</span><span style="display:flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:12px;background:rgba(230,30,60,.24);border:1.5px solid rgba(255,120,135,.6);font-weight:800;color:#FFC2CB">P</span><span>주차 중</span></div>
    <div style="display:flex;align-items:center;gap:20px"><span style="display:flex;align-items:center;height:40px;box-sizing:border-box;padding:0 16px;border-radius:20px;background:rgba(255,255,255,.08);border:1.5px solid rgba(255,255,255,.4);font-size:21px;font-weight:700;color:#FFF5F6">합성 위치</span><span style="font-weight:600">5G</span></div>
  </div>

  <header style="display:flex;align-items:center;gap:18px;height:92px;flex:none">
    <a href="RedProfileSetup.dc.html" aria-label="뒤로" style="display:flex;align-items:center;justify-content:center;width:76px;height:76px;flex:none;border-radius:50%;background:linear-gradient(155deg,rgba(255,255,255,.22),rgba(120,30,45,.18));border:1.5px solid rgba(255,210,216,.36);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.3),0 10px 26px rgba(0,0,0,.5)"><svg aria-hidden="true" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg></a>
    <div style="display:flex;flex-direction:column;gap:2px;flex:1;min-width:0">
      <h1 style="margin:0;font-size:44px;line-height:1.12;font-weight:800;letter-spacing:-0.02em;background:linear-gradient(180deg,#FFFFFF 20%,#FF9AA6 100%);-webkit-background-clip:text;background-clip:text;color:transparent">위치와 공개 범위 확인</h1>
      <span style="font-size:23px;color:#F3D4D9">상대가 무엇을 볼 수 있는지 먼저 확인하세요</span>
    </div>
    <ol aria-label="참여 준비 단계" style="display:flex;align-items:center;gap:12px;margin:0;padding:0;list-style:none">
      <li style="display:flex;align-items:center;gap:10px;height:56px;box-sizing:border-box;padding:0 22px 0 8px;border-radius:28px;background:rgba(0,0,0,.3);border:1.5px solid rgba(255,200,208,.3);font-size:23px;color:#F3D4D9"><span style="display:flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.12);font-size:21px">1</span>계정</li>
      <li style="display:flex;align-items:center;gap:10px;height:56px;box-sizing:border-box;padding:0 22px 0 8px;border-radius:28px;background:rgba(0,0,0,.3);border:1.5px solid rgba(255,200,208,.3);font-size:23px;color:#F3D4D9"><span style="display:flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.12);font-size:21px">2</span>프로필</li>
      <li style="display:flex;align-items:center;gap:10px;height:56px;box-sizing:border-box;padding:0 22px 0 8px;border-radius:28px;background:linear-gradient(180deg,#FFFFFF,#F0E4E6);box-shadow:inset 0 -3px 6px rgba(120,60,70,.2),0 8px 18px rgba(0,0,0,.4);font-size:23px;font-weight:800;color:#A50A23"><span style="display:flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:50%;background:radial-gradient(circle at 34% 24%,#FF8A96,#D5102F 60%,#8E0A20);font-size:21px;color:#FFFFFF">3</span>위치·공개 범위</li>
    </ol>
  </header>

  <div style="flex:1;min-height:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px">
    <section style="display:flex;flex-direction:column;gap:14px;box-sizing:border-box;padding:30px 34px;min-height:0;border-radius:32px;background:linear-gradient(155deg,rgba(255,255,255,.12) 0%,rgba(150,40,55,.1) 55%,rgba(20,4,8,.4) 100%);border:1.5px solid rgba(255,200,208,.24);box-shadow:0 18px 44px rgba(0,0,0,.6),inset 0 1.5px 0 rgba(255,255,255,.2)">
      <h2 style="margin:0 0 4px;font-size:38px;font-weight:800;letter-spacing:-0.02em;color:#FFFFFF">상대에게 보여요</h2>
      <sc-for list="{{shown}}" as="s" hint-placeholder-count="3">
        <div style="flex:1;min-height:0;display:flex;align-items:center;gap:20px;box-sizing:border-box;padding:0 24px;border-radius:28px;background:rgba(0,0,0,.4);border:1.5px solid rgba(255,200,208,.2)">
          <span style="display:flex;align-items:center;justify-content:center;width:72px;height:72px;flex:none;border-radius:50%;background:radial-gradient(circle at 32% 26%,rgba(255,170,180,.6),rgba(150,20,40,.45) 60%,rgba(30,4,8,.7));border:1.5px solid rgba(255,190,198,.45);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.45),inset 0 -4px 8px rgba(40,0,8,.5)"><svg aria-hidden="true" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#FFE3E7" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7-10-7-10-7zM12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"></path></svg></span>
          <span style="flex:1;display:flex;flex-direction:column;gap:2px">
            <span style="font-size:30px;font-weight:800;color:#FFFFFF">{{s.name}}</span>
            <span style="font-size:23px;color:#F3D4D9">{{s.value}}</span>
          </span>
        </div>
      </sc-for>
    </section>
    <section style="display:flex;flex-direction:column;gap:10px;box-sizing:border-box;padding:30px 34px;min-height:0;border-radius:32px;background:linear-gradient(155deg,rgba(255,255,255,.12) 0%,rgba(150,40,55,.1) 55%,rgba(20,4,8,.4) 100%);border:1.5px solid rgba(255,200,208,.24);box-shadow:0 18px 44px rgba(0,0,0,.6),inset 0 1.5px 0 rgba(255,255,255,.2)">
      <h2 style="margin:0 0 8px;font-size:38px;font-weight:800;letter-spacing:-0.02em;color:#FFFFFF">상대에게 보이지 않아요</h2>
      <sc-for list="{{hidden}}" as="h" hint-placeholder-count="5">
        <div style="flex:1;min-height:0;display:flex;align-items:center;gap:18px;border-top:1.5px solid rgba(255,200,208,.16)">
          <svg aria-hidden="true" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#FF9AA6" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="flex:none"><path d="M3 3l18 18M10 5.2A10.6 10.6 0 0 1 12 5c6 0 10 7 10 7a18 18 0 0 1-3.3 4M6.5 6.6A17.6 17.6 0 0 0 2 12s4 7 10 7a10 10 0 0 0 4.4-1"></path></svg>
          <span style="font-size:29px;font-weight:600;color:#FFFFFF">{{h}}</span>
        </div>
      </sc-for>
    </section>
  </div>

  <section style="position:relative;overflow:hidden;height:280px;flex:none;display:flex;align-items:center;gap:40px;box-sizing:border-box;padding:24px 44px 56px;border-radius:32px;background:linear-gradient(120deg,#3A0710 0%,#1A0408 58%,#0C0305 100%);border:1.5px solid rgba(255,200,208,.3);box-shadow:0 26px 60px rgba(0,0,0,.7),inset 0 1.5px 0 rgba(255,255,255,.2)">
    <img src="/_blob/329b012083fc4c594e7d14aeffe64450" alt="" style="position:absolute;left:0;bottom:-8px;width:1536px;height:90px;filter:drop-shadow(0 0 14px rgba(240,40,70,.6))">
    <div style="position:relative;flex:1;min-width:0;display:flex;flex-direction:column;gap:10px">
      <h2 style="margin:0;font-size:48px;line-height:1.2;font-weight:800;letter-spacing:-0.025em;color:#FFFFFF">위치는 근처 여부를 판단할 때만 써요</h2>
      <p style="margin:0;font-size:26px;line-height:1.45;color:#F7DDE1">상대에게 위치를 전달하지 않아요. 이번 시연은 합성 위치로 움직여요.</p>
    </div>
    <button type="button" onClick="{{toggle}}" aria-pressed="{{on}}" style="position:relative;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:10px;width:400px;height:190px;flex:none;box-sizing:border-box;padding:0 30px;border-radius:36px;background:linear-gradient(155deg,rgba(255,255,255,.2),rgba(60,10,20,.55));border:1.5px solid rgba(255,210,216,.4);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.3),0 14px 30px rgba(0,0,0,.55);font-family:inherit;text-align:left;color:#FFFFFF;cursor:pointer">
      <span style="font-size:29px;font-weight:800">시작하면서 발견 켜기</span>
      <span style="display:flex;align-items:center;justify-content:{{align}};width:112px;height:60px;box-sizing:border-box;padding:5px;border-radius:30px;background:{{track}};box-shadow:{{trackSh}}"><span style="display:block;width:50px;height:50px;border-radius:50%;background:{{knob}};box-shadow:0 3px 8px rgba(0,0,0,.5)"></span></span>
      <span style="font-size:22px;color:#F7DDE1">켜도 대화는 따로 수락해요</span>
    </button>
  </section>

  <div style="display:grid;grid-template-columns:1fr 2fr;gap:14px;flex:none">
    <a href="RedProfileSetup.dc.html" style="display:flex;align-items:center;justify-content:center;height:108px;box-sizing:border-box;border-radius:40px;background:linear-gradient(155deg,rgba(255,255,255,.18),rgba(120,30,45,.16));border:1.5px solid rgba(255,210,216,.36);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.28),inset 0 -5px 10px rgba(0,0,0,.25),0 8px 20px rgba(0,0,0,.35);font-size:28px;font-weight:700;color:#FFFFFF">이전</a>
    <a href="RedHome.dc.html" style="display:flex;align-items:center;justify-content:center;height:108px;box-sizing:border-box;border-radius:40px;background:linear-gradient(180deg,#FF4A5E 0%,#D5102F 52%,#A50A23 100%);border:1.5px solid rgba(255,190,198,.7);box-shadow:0 0 36px rgba(230,30,60,.55),inset 0 2.5px 0 rgba(255,255,255,.45),inset 0 -7px 14px rgba(90,0,15,.55);font-size:36px;font-weight:800;color:#FFFFFF">동의하고 시작</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1600,"height":1280}}'>
class Component extends DCLogic {
  state = { on: false };
  renderVals() {
    const on = this.state.on;
    return {
      on,
      toggle: () => this.setState({ on: !this.state.on }),
      track: on ? 'linear-gradient(180deg,#FF4A5E,#C20D29)' : 'rgba(0,0,0,.5)',
      trackSh: on ? 'inset 0 2px 0 rgba(255,255,255,.4),0 0 22px rgba(230,30,60,.6)' : 'inset 0 2px 6px rgba(0,0,0,.6)',
      knob: on ? 'radial-gradient(circle at 35% 30%,#FFFFFF,#EADCDF)' : '#9A8A8E',
      align: on ? 'flex-end' : 'flex-start',
      shown: [
        { name: '닉네임', value: '새벽드라이브' },
        { name: '가상 아바타', value: '직접 고른 캐릭터' },
        { name: '관심사', value: '야경, 재즈, 드라이브 음악, 커피' },
      ],
      hidden: ['정확한 위치', '차량번호와 차량 외형', '집과 목적지', '이동 경로', '실명과 연락처'],
    };
  }
}
</script>
</body>
</html>
