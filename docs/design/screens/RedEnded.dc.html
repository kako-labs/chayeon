<div style="position:relative;width:1600px;height:1280px;box-sizing:border-box;padding:18px 32px 22px;display:flex;flex-direction:column;gap:14px;overflow:hidden;word-break:keep-all;color:#FFF5F6;font-family:'Asta Sans','Noto Sans KR',system-ui,sans-serif;font-variant-numeric:tabular-nums;background:radial-gradient(1100px 620px at 82% 4%,#5A0714 0%,rgba(90,7,20,0) 62%),radial-gradient(900px 620px at 4% 58%,#33050D 0%,rgba(51,5,13,0) 60%),radial-gradient(1000px 480px at 60% 104%,#45060F 0%,rgba(69,6,15,0) 62%),#070304">

    <div style="display:flex;align-items:center;gap:20px"><span style="display:flex;align-items:center;height:40px;box-sizing:border-box;padding:0 16px;border-radius:20px;background:rgba(255,255,255,.08);border:1.5px solid rgba(255,255,255,.4);font-size:21px;font-weight:700;color:#FFF5F6">합성 위치</span><span style="font-weight:600">5G</span></div>

  <section style="position:relative;overflow:hidden;flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;box-sizing:border-box;padding:40px 44px;border-radius:32px;background:radial-gradient(1000px 460px at 50% 52%,#3E0812 0%,rgba(62,8,18,0) 72%),linear-gradient(160deg,#1E040A 0%,#100306 60%,#090304 100%);border:1.5px solid rgba(255,200,208,.26);box-shadow:0 26px 60px rgba(0,0,0,.7),inset 0 1.5px 0 rgba(255,255,255,.18);text-align:center">

      <div style="display:flex;flex-direction:column;gap:4px;box-sizing:border-box;padding:20px 28px;border-radius:30px;background:rgba(0,0,0,.42);border:1.5px solid rgba(255,200,208,.2);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.1);text-align:left"><span style="font-size:23px;color:#F3D4D9">함께한 시간</span><span style="font-size:42px;font-weight:800;color:#FFFFFF">18분</span></div>

      <div style="display:flex;flex-direction:column;gap:4px;box-sizing:border-box;padding:20px 28px;border-radius:30px;background:rgba(0,0,0,.42);border:1.5px solid rgba(255,200,208,.2);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.1);text-align:left"><span style="font-size:23px;color:#F3D4D9">끝난 이유</span><span style="font-size:42px;font-weight:800;color:#FFFFFF">{{short}}</span></div>
    </div>
  </section>

  <div style="display:grid;grid-template-columns:1fr 2fr;gap:14px;flex:none">
    <a href="RedHome.dc.html" style="display:flex;align-items:center;justify-content:center;height:112px;box-sizing:border-box;border-radius:40px;background:linear-gradient(155deg,rgba(255,255,255,.18),rgba(120,30,45,.16));border:1.5px solid rgba(255,210,216,.36);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.28),inset 0 -5px 10px rgba(0,0,0,.25),0 8px 20px rgba(0,0,0,.35);font-size:28px;font-weight:700;color:#FFFFFF">오늘의 인연으로</a>
    <a href="RedEncounterDetail.dc.html" style="display:flex;align-items:center;justify-content:center;height:112px;box-sizing:border-box;border-radius:40px;background:linear-gradient(180deg,#FF4A5E 0%,#D5102F 52%,#A50A23 100%);border:1.5px solid rgba(255,190,198,.7);box-shadow:0 0 36px rgba(230,30,60,.55),inset 0 2.5px 0 rgba(255,255,255,.45),inset 0 -7px 14px rgba(90,0,15,.55);font-size:36px;font-weight:800;color:#FFFFFF">기록 보기</a>

</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"reason":{"editor":"enum","options":["멀어짐","상대가 나감","내가 나감","상태 확인 불가","발견 끔"],"default":"멀어짐"},"$preview":{"width":1600,"height":1280}}'>

  renderVals() {
    const tail = '스친 인연에 시각과 기간만 남겨요. 위치와 경로는 남기지 않아요.';
    const map = {
      '멀어짐': { tag: '연결 종료', title: '멀어져서 연결이 끝났어요', body: tail, short: '멀어짐' },
      '상대가 나감': { tag: '연결 종료', title: '느린오후 님이 연결을 마쳤어요', body: tail, short: '상대가 나감' },
      '내가 나감': { tag: '연결 종료', title: '연결을 마쳤어요', body: tail, short: '내가 나감' },
      '상태 확인 불가': { tag: '상태 확인 불가', title: '연결 상태를 확인할 수 없어 끝냈어요', body: '위치나 통신이 오래 끊겼어요. 멀어졌다고 판단한 것은 아니에요.', short: '확인 불가' },
      '발견 끔': { tag: '연결 종료', title: '발견을 꺼서 연결이 끝났어요', body: tail, short: '발견 끔' },
    };
    return map[this.props.reason ?? '멀어짐'] || map['멀어짐'];
  }
}
</script>
</body>
</html>
