<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>기록·계정 정리</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Asta+Sans:wght@300..800&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#070304}
a{color:inherit;text-decoration:none}
a:focus-visible,button:focus-visible{outline:3px solid #FFFFFF;outline-offset:3px}
</style>
</helmet>
<div style="position:relative;width:1600px;height:1280px;box-sizing:border-box;padding:18px 32px 22px;display:flex;flex-direction:column;gap:14px;overflow:hidden;word-break:keep-all;color:#FFF5F6;font-family:'Asta Sans','Noto Sans KR',system-ui,sans-serif;font-variant-numeric:tabular-nums;background:radial-gradient(1100px 620px at 82% 4%,#5A0714 0%,rgba(90,7,20,0) 62%),radial-gradient(900px 620px at 4% 58%,#33050D 0%,rgba(51,5,13,0) 60%),radial-gradient(1000px 480px at 60% 104%,#45060F 0%,rgba(69,6,15,0) 62%),#070304">

  <div style="display:flex;align-items:center;justify-content:space-between;height:46px;flex:none;font-size:22px;color:#F3D4D9">
    <div style="display:flex;align-items:center;gap:22px"><span style="font-size:26px;font-weight:700;color:#FFFFFF">오후 8:14</span><span style="display:flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:12px;background:rgba(230,30,60,.24);border:1.5px solid rgba(255,120,135,.6);font-weight:800;color:#FFC2CB">P</span><span>주차 중</span></div>
    <div style="display:flex;align-items:center;gap:20px"><span style="display:flex;align-items:center;height:40px;box-sizing:border-box;padding:0 16px;border-radius:20px;background:rgba(255,255,255,.08);border:1.5px solid rgba(255,255,255,.4);font-size:21px;font-weight:700;color:#FFF5F6">합성 위치</span><span style="font-weight:600">5G</span></div>
  </div>

  <header style="display:flex;align-items:center;gap:18px;height:92px;flex:none">
    <a href="RedSettings.dc.html" aria-label="뒤로" style="display:flex;align-items:center;justify-content:center;width:76px;height:76px;flex:none;border-radius:50%;background:linear-gradient(155deg,rgba(255,255,255,.22),rgba(120,30,45,.18));border:1.5px solid rgba(255,210,216,.36);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.3),0 10px 26px rgba(0,0,0,.5)"><svg aria-hidden="true" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg></a>
    <div style="display:flex;flex-direction:column;gap:2px;flex:1;min-width:0">
      <h1 style="margin:0;font-size:44px;line-height:1.12;font-weight:800;letter-spacing:-0.02em;background:linear-gradient(180deg,#FFFFFF 20%,#FF9AA6 100%);-webkit-background-clip:text;background-clip:text;color:transparent">기록과 계정 정리</h1>
      <span style="font-size:23px;color:#F3D4D9">각 동작은 서로 대신하지 않아요. 무엇이 멈추고 무엇이 남는지 확인하세요.</span>
    </div>
  </header>

  <div style="display:grid;grid-template-columns:290px 1fr 1fr 210px;gap:20px;flex:none;box-sizing:border-box;padding:0 28px;font-size:24px;font-weight:700;color:#F3D4D9">
    <span>동작</span><span>멈추거나 지워져요</span><span>그대로 남아요</span><span></span>
  </div>

  <div style="flex:1;min-height:0;display:flex;flex-direction:column;gap:10px">
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="6">
      <div style="flex:1;min-height:0;display:grid;grid-template-columns:290px 1fr 1fr 210px;align-items:center;gap:20px;box-sizing:border-box;padding:0 28px;border-radius:36px;background:linear-gradient(155deg,rgba(255,255,255,.12) 0%,rgba(150,40,55,.1) 55%,rgba(20,4,8,.4) 100%);border:1.5px solid rgba(255,200,208,.24);box-shadow:0 12px 28px rgba(0,0,0,.45),inset 0 1.5px 0 rgba(255,255,255,.2)">
        <span style="font-size:33px;line-height:1.2;font-weight:800;letter-spacing:-0.02em;color:#FFFFFF">{{r.name}}</span>
        <span style="font-size:25px;line-height:1.38;color:#FFF5F6">{{r.stops}}</span>
        <span style="font-size:25px;line-height:1.38;color:#F3D4D9">{{r.keeps}}</span>
        <sc-if value="{{r.isLink}}" hint-placeholder-val="{{ true }}">
          <a href="{{r.href}}" style="display:flex;align-items:center;justify-content:center;height:80px;box-sizing:border-box;border-radius:34px;background:linear-gradient(155deg,rgba(255,255,255,.18),rgba(120,30,45,.16));border:1.5px solid rgba(255,210,216,.36);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.28),inset 0 -5px 10px rgba(0,0,0,.25),0 8px 20px rgba(0,0,0,.35);font-size:26px;font-weight:700;color:#FFFFFF">{{r.action}}</a>
        </sc-if>
        <sc-if value="{{r.isDanger}}" hint-placeholder-val="{{ false }}">
          <button type="button" onClick="{{ask}}" style="height:80px;box-sizing:border-box;border-radius:34px;background:rgba(0,0,0,.35);border:1.5px solid rgba(255,107,125,.7);font-family:inherit;font-size:26px;font-weight:700;color:#FF9AA6;cursor:pointer">{{r.action}}</button>
        </sc-if>
      </div>
    </sc-for>
  </div>

  <sc-if value="{{confirm}}" hint-placeholder-val="{{ false }}">
    <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.72)">
      <div role="dialog" aria-modal="true" aria-label="계정 삭제 확인" style="display:flex;flex-direction:column;gap:18px;width:880px;box-sizing:border-box;padding:44px;border-radius:40px;background:linear-gradient(160deg,#3A0710 0%,#1A0408 60%,#0C0305 100%);border:1.5px solid rgba(255,200,208,.4);box-shadow:0 40px 90px rgba(0,0,0,.8),inset 0 2px 0 rgba(255,255,255,.22)">
        <h2 style="margin:0;font-size:54px;line-height:1.2;font-weight:800;letter-spacing:-0.025em;color:#FFFFFF">계정을 삭제할까요?</h2>
        <p style="margin:0;font-size:28px;line-height:1.45;color:#F7DDE1">프로필, 스친 인연, 이어진 인연이 모두 삭제되고 되돌릴 수 없어요. 신고 기록은 [보관 기간] 동안 제한 보관해요.</p>
        <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:10px">
          <button type="button" onClick="{{cancel}}" style="height:104px;box-sizing:border-box;border-radius:40px;background:linear-gradient(155deg,rgba(255,255,255,.18),rgba(120,30,45,.16));border:1.5px solid rgba(255,210,216,.36);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.28);font-family:inherit;font-size:30px;font-weight:800;color:#FFFFFF;cursor:pointer">취소</button>
          <a href="RedFirstRun.dc.html" style="display:flex;align-items:center;justify-content:center;height:104px;box-sizing:border-box;border-radius:40px;background:linear-gradient(180deg,#FFFFFF,#F0E4E6);box-shadow:inset 0 -6px 12px rgba(120,60,70,.24),0 12px 28px rgba(0,0,0,.5);font-size:30px;font-weight:800;color:#A50A23">계정 삭제</a>
        </div>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1600,"height":1280}}'>
class Component extends DCLogic {
  state = { confirm: false };
  renderVals() {
    const link = (name, stops, keeps, action, href) => ({ name, stops, keeps, action, href, isLink: true, isDanger: false });
    return {
      confirm: this.state.confirm,
      ask: () => this.setState({ confirm: true }),
      cancel: () => this.setState({ confirm: false }),
      rows: [
        link('발견 끄기', '새 노출과 요청이 멈추고, 진행 중인 일시 연결도 끝나요.', '스친 인연과 이어진 인연은 그대로예요.', '끄기', 'RedHome.dc.html'),
        link('일시 연결 나가기', '지금 연결과 인사만 끝나요.', '발견 상태는 그대로이고, 기록이 하나 남아요.', '나가기', 'RedEnded.dc.html'),
        link('애프터 관계 끝내기', '이어진 대화가 닫히고 다시 열리지 않아요.', '처음 스친 기록은 남아요.', '선택', 'RedAfterConnected.dc.html'),
        link('내 기록 삭제', '내 화면에서 기록이 사라져요.', '상대의 기록은 그대로예요. 차단은 아니에요.', '선택', 'RedEncounters.dc.html'),
        link('로그아웃', '이 차량의 프로필, 대화, 로그인 정보가 지워져요.', '계정과 서버의 기록은 남아요.', '로그아웃', 'RedFirstRun.dc.html'),
        { name: '계정 삭제', stops: '프로필, 기록, 이어진 관계가 모두 삭제돼요.', keeps: '신고 기록은 [보관 기간] 동안 제한 보관해요.', action: '삭제', isLink: false, isDanger: true },
      ],
    };
  }
}
</script>
</body>
</html>
