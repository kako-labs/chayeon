  <div style="display:flex;align-items:center;justify-content:space-between;height:46px;flex:none;font-size:22px;color:#F3D4D9">
    <div style="display:flex;align-items:center;gap:22px"><span style="font-size:26px;font-weight:700;color:#FFFFFF">오후 7:24</span><span style="display:flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:12px;background:rgba(230,30,60,.24);border:1.5px solid rgba(255,120,135,.6);font-weight:800;color:#FFC2CB">P</span><span>주차 중</span></div>

  </div>

  <section style="position:relative;overflow:hidden;height:476px;flex:none;display:flex;flex-direction:column;box-sizing:border-box;padding:28px 44px;border-radius:32px;background:radial-gradient(1000px 420px at 50% 66%,#6A0C1C 0%,rgba(106,12,28,0) 72%),linear-gradient(160deg,#2A050C 0%,#14040A 60%,#0A0304 100%);border:1.5px solid rgba(255,200,208,.3);box-shadow:0 26px 60px rgba(0,0,0,.7),inset 0 1.5px 0 rgba(255,255,255,.2)">
    <div style="display:flex;align-items:center;gap:18px;flex:none">
      <span style="display:flex;align-items:center;gap:10px;height:50px;box-sizing:border-box;padding:0 22px;border-radius:25px;background:rgba(230,30,60,.24);border:1.5px solid rgba(255,120,135,.6);font-size:24px;font-weight:700;color:#FFC2CB"><span aria-hidden="true" style="width:14px;height:14px;border-radius:50%;background:#FF5A6E;box-shadow:0 0 12px #FF5A6E"></span>연결 중 12분</span>
      <h1 style="margin:0;flex:1;min-width:0;font-size:50px;line-height:1.2;font-weight:800;letter-spacing:-0.025em;background:linear-gradient(180deg,#FFFFFF 30%,#FFC2CB 100%);-webkit-background-clip:text;background-clip:text;color:transparent">느린오후 님과 이어져 있어요</h1>
      <span style="font-size:24px;color:#F7DDE1">근처에 있는 동안만 이어져요</span>
    </div>
    <div style="flex:1;min-height:0;display:flex;align-items:center;justify-content:center">
      <div style="display:flex;flex-direction:column;align-items:center;gap:6px;width:280px;flex:none">
        <img src="/_blob/0f904edde89f1735c44ed93beec99bb1" alt="" style="width:270px;height:270px;filter:drop-shadow(0 20px 24px rgba(0,0,0,.7))">
        <span style="font-size:32px;font-weight:800;letter-spacing:-0.02em;color:#FFFFFF">새벽드라이브</span>
      </div>
      <div style="position:relative;display:flex;align-items:center;width:880px;height:176px;flex:none">
        <img src="/_blob/02c94817e16fd7cb7629fe16b54d428b" alt="" style="width:880px;height:176px;filter:drop-shadow(0 0 16px rgba(240,40,70,.75)) drop-shadow(0 12px 14px rgba(0,0,0,.6))">
        <svg aria-hidden="true" width="880" height="176" viewBox="0 0 800 160" fill="none" style="position:absolute;left:0;top:0"><path d="M12 80 C 130 28,270 132,400 80 C 530 28,670 132,788 80" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-dasharray="2 58" opacity=".9" style="animation:flow 3.6s linear infinite"></path></svg>
      </div>
      <div style="display:flex;flex-direction:column;align-items:center;gap:6px;width:280px;flex:none">
        <img src="/_blob/c6f3bc14f5339443dc40ef660adcf415" alt="" style="width:270px;height:270px;filter:drop-shadow(0 20px 24px rgba(0,0,0,.7))">
        <span style="font-size:32px;font-weight:800;letter-spacing:-0.02em;color:#FFFFFF">느린오후</span>
      </div>
    </div>
  </section>

  <div style="flex:1;min-height:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px">
    <section style="display:flex;flex-direction:column;gap:14px;box-sizing:border-box;padding:24px 30px;min-height:0;border-radius:32px;background:linear-gradient(155deg,rgba(255,255,255,.12) 0%,rgba(150,40,55,.1) 55%,rgba(20,4,8,.4) 100%);border:1.5px solid rgba(255,200,208,.24);box-shadow:0 18px 44px rgba(0,0,0,.6),inset 0 1.5px 0 rgba(255,255,255,.2)">
      <h2 style="margin:0;font-size:30px;font-weight:800;color:#FFFFFF">주고받은 인사</h2>
      <div style="flex:1;min-height:0;display:flex;flex-direction:column;justify-content:flex-end;gap:12px;overflow:hidden">
        <sc-for list="{{msgs}}" as="m" hint-placeholder-count="3">
          <div style="display:flex;flex-direction:column;align-items:{{m.align}};flex:none">
            <span style="display:block;max-width:80%;box-sizing:border-box;padding:14px 26px;border-radius:30px;background:{{m.bg}};border:{{m.bd}};box-shadow:{{m.sh}};font-size:28px;line-height:1.3;font-weight:600;color:#FFFFFF">{{m.text}}</span>
          </div>
        </sc-for>
      </div>
      <span style="flex:none;font-size:22px;color:#F3D4D9">{{status}}</span>
    </section>
    <section style="display:flex;flex-direction:column;gap:14px;box-sizing:border-box;padding:24px 30px;min-height:0;border-radius:32px;background:linear-gradient(155deg,rgba(255,255,255,.12) 0%,rgba(150,40,55,.1) 55%,rgba(20,4,8,.4) 100%);border:1.5px solid rgba(255,200,208,.24);box-shadow:0 18px 44px rgba(0,0,0,.6),inset 0 1.5px 0 rgba(255,255,255,.2)">
      <h2 style="margin:0;font-size:30px;font-weight:800;color:#FFFFFF">인사 보내기</h2>
      <div style="flex:1;min-height:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(3,minmax(0,1fr));gap:12px">
        <sc-for list="{{presets}}" as="p" hint-placeholder-count="6">
          <button type="button" onClick="{{p.send}}" style="box-sizing:border-box;padding:0 16px;border-radius:32px;background:linear-gradient(155deg,rgba(255,255,255,.18),rgba(120,30,45,.16));border:1.5px solid rgba(255,210,216,.36);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.28),inset 0 -5px 10px rgba(0,0,0,.25),0 8px 20px rgba(0,0,0,.35);font-family:inherit;font-size:27px;line-height:1.25;font-weight:700;color:#FFFFFF;cursor:pointer">{{p.text}}</button>
        </sc-for>
      </div>
    </section>
  </div>

  <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;flex:none">
    <a href="RedEnded.dc.html" style="display:flex;align-items:center;justify-content:center;height:92px;box-sizing:border-box;border-radius:38px;background:linear-gradient(155deg,rgba(255,255,255,.18),rgba(120,30,45,.16));border:1.5px solid rgba(255,210,216,.36);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.28),inset 0 -5px 10px rgba(0,0,0,.25),0 8px 20px rgba(0,0,0,.35);font-size:30px;font-weight:800;color:#FFFFFF">나가기</a>
    <a href="RedBlockReport.dc.html" style="display:flex;align-items:center;justify-content:center;height:92px;box-sizing:border-box;border-radius:38px;background:rgba(0,0,0,.35);border:1.5px solid rgba(255,107,125,.7);font-size:30px;font-weight:800;color:#FF9AA6">차단·신고</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1600,"height":1280}}'>
class Component extends DCLogic {
  state = {
    msgs: [
      { id: 1, mine: true, text: '안녕하세요' },
      { id: 2, mine: false, text: '반가워요' },
    ],
    next: 0,
    sending: false,
  };
  timer = null;
  componentWillUnmount() { clearTimeout(this.timer); }
  send(text) {
    const replies = ['좋은 저녁이에요', '관심사가 비슷하네요', '잠시 후 다시 이야기해요'];
    const msgs = this.state.msgs.concat({ id: Date.now(), mine: true, text });
    this.setState({ msgs, sending: true });
    clearTimeout(this.timer);
    this.timer = setTimeout(() => {
      const i = this.state.next % replies.length;
      this.setState({
        msgs: this.state.msgs.concat({ id: Date.now() + 1, mine: false, text: replies[i] }),
        next: this.state.next + 1,
        sending: false,
      });
    }, 1200);
  }
  renderVals() {
    const presets = ['안녕하세요', '반가워요', '좋은 저녁이에요', '관심사가 비슷하네요', '잠시 후 다시 이야기해요', '조심히 가세요'];
    return {
      msgs: this.state.msgs.slice(-4).map((m) => ({
        ...m,
        align: m.mine ? 'flex-end' : 'flex-start',
        bg: m.mine ? 'linear-gradient(180deg,#FF4A5E 0%,#D5102F 55%,#A50A23 100%)' : 'rgba(255,255,255,.14)',
        bd: m.mine ? '1.5px solid rgba(255,190,198,.6)' : '1.5px solid rgba(255,200,208,.24)',
        sh: m.mine ? 'inset 0 2px 0 rgba(255,255,255,.4),inset 0 -4px 8px rgba(90,0,15,.45),0 8px 18px rgba(0,0,0,.4)' : 'inset 0 1.5px 0 rgba(255,255,255,.2),0 8px 18px rgba(0,0,0,.3)',
      })),
      status: this.state.sending ? '보냈어요. 상대 화면에 전달 중이에요.' : '준비된 문장만 주고받아요. 주차 중에만 보낼 수 있어요.',
      presets: presets.map((text) => ({ text, send: () => this.send(text) })),
    };
  }
}
</script>
