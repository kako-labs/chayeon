name: Chayeon foundation
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
    paths-ignore: ['**.md', 'docs/**']
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: python3 scripts/dev.py setup-sdk
      - run: python3 scripts/dev.py verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-verification
          path: |
            **/build/reports/
            **/build/test-results/
            **/build/outputs/roborazzi/
  server:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: env -u ANDROID_HOME -u ANDROID_SDK_ROOT ./gradlew -Pchayeon.serverOnly=true :server:build --no-daemon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: server-verification
          path: |
            server/build/reports/
            server/build/test-results/
